<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baltazar Ferreira — Serigrafia em Portugal</title>
<meta name="description" content="Fornecedor de serigrafia em Portugal há 25 anos: emulsões, tintas, telas, rodos e serviços de gravação de quadros. Entrega nacional e europeia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e1a2b;--ink2:#44546a;--bg:#f5f7fa;--card:#fff;--line:#dfe4ec;--blue:#2f5d9e;--blue-d:#234a82;--blue-l:#e8eff9;--navy:#0b1626;--amber:#f0b429;--r:14px;--sp:8px;--shadow:0 1px 2px rgba(14,26,43,.05),0 8px 24px rgba(14,26,43,.06)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:16px/1.6 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Manrope,Inter,sans-serif;line-height:1.15;letter-spacing:-.02em}
h1{font-size:clamp(2.2rem,5vw,3.6rem);font-weight:800}
h2{font-size:clamp(1.6rem,3vw,2.3rem);font-weight:800}
h3{font-size:1.1rem;font-weight:700}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
html{scrollbar-width:thin;scrollbar-color:#6f8fc0 #e9eef5}
@supports selector(::-webkit-scrollbar){html{scrollbar-color:auto}
::-webkit-scrollbar{width:13px;height:13px}
::-webkit-scrollbar-track{background:#e9eef5}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#5b82bd,#2f5d9e);border-radius:99px;border:3px solid #e9eef5}
::-webkit-scrollbar-thumb:hover{background:#234a82;border:3px solid #e9eef5}}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
section{padding:80px 0}
.eyebrow{font:600 .78rem Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:12px}
.lead{color:var(--ink2);font-size:1.1rem;max-width:62ch;margin-top:16px}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
input:focus-visible,textarea:focus-visible{outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:10px;border:1.5px solid transparent;font-weight:600;font-size:.95rem;transition:.18s;white-space:nowrap}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover{background:var(--blue-d)}
.btn-o{background:transparent;border-color:var(--line);color:var(--ink)}.btn-o:hover{border-color:var(--blue);color:var(--blue)}
.btn-w{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.35);color:#fff}.btn-w:hover{background:rgba(255,255,255,.2)}
.btn-sm{padding:9px 14px;font-size:.85rem}
/* header */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:24px;height:72px}
.logo{display:flex;align-items:center;gap:12px;font:800 1.05rem Manrope;white-space:nowrap}
.logo img{height:46px;width:auto;object-fit:contain}
footer .logo img{filter:brightness(1.9) saturate(.85)}
.logo small{display:block;font:500 .7rem Inter;color:var(--ink2);letter-spacing:.04em}
nav{display:flex;gap:4px;margin-left:auto}
nav a{white-space:nowrap;padding:8px 13px;border-radius:8px;font-weight:500;font-size:.93rem;color:var(--ink2)}
nav a:hover{color:var(--ink);background:var(--bg)}
nav a[aria-current=page]{color:var(--blue);background:var(--blue-l)}
.hd-r{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:none;padding:6px 10px;font-weight:600;font-size:.8rem;color:var(--ink2)}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}
.cart-b{display:inline-flex;align-items:center;gap:9px;height:42px;padding:0 10px 0 13px;border-radius:11px;background:var(--blue-l);border:1px solid #cddcf1;color:var(--blue-d);font-weight:600;font-size:.88rem;transition:.18s}
.cart-b:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.cart-b b{min-width:24px;height:24px;border-radius:12px;background:var(--blue);color:#fff;font:700 .75rem/24px Inter;text-align:center;padding:0 7px;transition:.18s}
.cart-b:hover b{background:#fff;color:var(--blue)}
.cart-b:not(:has(b)){padding-right:13px}
.cart-b.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.1)}}
.menu-b{display:none}
/* hero */
.hero{position:relative;color:#fff;padding:0;overflow:hidden;background:var(--navy)}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.72;filter:contrast(1.08) saturate(1.1)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(95deg,rgba(11,22,38,.95) 25%,rgba(11,22,38,.45))}
.hero .wrap{position:relative;z-index:1;padding-top:128px;padding-bottom:128px}
.hero h1{font-size:clamp(2.5rem,5.6vw,4.2rem);max-width:17ch}
.hero .btn{padding:16px 28px;font-size:1rem}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero p{max-width:58ch;color:#c9d4e4;font-size:1.25rem;margin:26px 0 40px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.chips{display:flex;gap:10px 22px;flex-wrap:wrap;margin-top:44px;color:#b4c2d6;font-size:.9rem}
.chips span:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:9px}
.phead{background:var(--navy);color:#fff;padding:64px 0 56px;position:relative;overflow:hidden}
.phead.img>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.3}
.phead .wrap{position:relative}
.phead p{color:#b9c6da;margin-top:14px;max-width:60ch;font-size:1.05rem}
.crumbs{font-size:.82rem;color:#8da0bb;margin-bottom:14px}
.crumbs a:hover{color:#fff}
/* stats */
.stats{background:#fff;border-bottom:1px solid var(--line);padding:0}
.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:34px 24px;border-right:1px solid var(--line)}.stat:last-child{border:0}
.stat b{display:block;font:800 2.3rem Manrope;color:var(--blue);letter-spacing:-.03em}
.stat span{color:var(--ink2);font-size:.9rem}
/* grids */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.cols2{grid-template-columns:1fr 1fr}.cols-c{grid-template-columns:1fr 1.4fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;box-shadow:var(--shadow);transition:.2s}
a.card:hover,.card.hov:hover{transform:translateY(-3px);border-color:#c3cee0}
.ic{width:46px;height:46px;border-radius:12px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;margin-bottom:18px}
.card p{color:var(--ink2);font-size:.94rem;margin-top:8px}
.card ul{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:7px;font-size:.9rem;color:var(--ink2)}
.card li:before{content:"✓";color:var(--blue);font-weight:700;margin-right:9px}
.more{display:inline-block;margin-top:18px;font-weight:600;color:var(--blue);font-size:.9rem}
.sechead{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:40px;flex-wrap:wrap}
/* studio tiles for products */
.tile{position:relative;aspect-ratio:4/3;border-radius:10px;background:#e9edf3;overflow:hidden;display:block}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s}
.card:hover .tile img{transform:scale(1.05)}
.catcard{padding:14px 14px 22px}.catcard h3{margin:16px 8px 0}.catcard span{display:block;margin:4px 8px 0;color:var(--ink2);font-size:.85rem}
.dark{background:var(--navy);color:#fff}.dark .lead{color:#b9c6da}.dark .eyebrow{color:var(--amber)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:44px;counter-reset:s}
.step{padding:0 26px 0 0;position:relative}
.step:before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--amber);color:var(--amber);font:700 .95rem Manrope;margin-bottom:18px;background:var(--navy);position:relative;z-index:1}
.step:after{content:"";position:absolute;top:20px;left:44px;right:6px;height:1px;background:rgba(255,255,255,.18)}.step:last-child:after{display:none}
.step p{color:#aebdd3;font-size:.92rem;margin-top:6px}
.cta{background:var(--blue);color:#fff;text-align:center;padding:72px 0}.cta p{color:#d6e2f4;margin:14px auto 28px;max-width:52ch}
.cta .btn-p{background:#fff;color:var(--blue-d)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:.85rem;font-weight:500;color:var(--ink2)}
button.pill{transition:.15s}button.pill:hover{border-color:var(--blue);color:var(--blue)}
button.pill[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
/* products */
.shop{display:grid;grid-template-columns:250px 1fr;gap:32px;align-items:start}
.side{position:sticky;top:96px}
.side .cat{display:flex;justify-content:space-between;width:100%;padding:11px 14px;border:0;border-radius:10px;background:none;font-weight:500;color:var(--ink2);text-align:left}
.side .cat:hover{background:#fff}.side .cat[aria-pressed=true]{background:var(--blue);color:#fff}
.search{display:block;margin-bottom:14px}
.field{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;transition:border-color .15s;position:relative}
.field:focus-within{border-color:#8794a9}
.field label{display:block;font-size:.75rem;font-weight:600;color:var(--ink2);margin-bottom:2px}
.field input,.field textarea{width:100%;border:0;background:none;font:inherit;color:var(--ink);caret-color:var(--blue);outline:none;resize:vertical}
.field .cnt{position:absolute;right:12px;bottom:8px;font-size:.72rem;color:var(--ink2)}
.field .cnt.warn{color:#b4533a;font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.pcard{padding:14px;display:flex;flex-direction:column}
.pcard .tile{cursor:pointer;border:0;padding:0;width:100%}
.pcard small{color:var(--blue);font-weight:600;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;margin-top:16px}
.pcard h3{margin-top:4px}.pcard p{flex:1}
.pcard .row{margin-top:16px;gap:8px}.pcard .row .btn{flex:1;padding:9px 10px}
.empty{padding:60px 20px;text-align:center;color:var(--ink2);background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
/* cart */
.cart{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;align-items:start}
.line{display:grid;grid-template-columns:96px 1fr auto;gap:18px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.line:last-child{border:0}.line .tile{aspect-ratio:1}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:8px}
.qty button{width:34px;height:34px;border:0;background:#fff;font-size:1.1rem}.qty button:hover{background:var(--bg)}
.qty span{min-width:36px;text-align:center;font-weight:600}
.rm{background:none;border:0;color:var(--ink2);font-size:.85rem;text-decoration:underline}
.sum{position:sticky;top:96px}
.form{display:grid;gap:12px;margin-top:18px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.consent{display:flex;gap:10px;font-size:.82rem;color:var(--ink2);align-items:flex-start}
.consent input{margin-top:4px;accent-color:var(--blue);width:16px;height:16px;flex:none}
.err{color:#b4533a;font-size:.85rem}
.ok{background:#eaf6ee;border:1px solid #bfe0c9;color:#1f5f35;border-radius:12px;padding:18px 20px;font-weight:500}
.info{display:grid;gap:18px}.info div b{display:block;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
/* blog, faq */
.bcard{padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;width:100%}
.bcard .top{padding:26px 26px 0;flex:1}
.bcard .tags{display:flex;gap:6px;flex-wrap:wrap}.bcard .tags span{font-size:.68rem;font-weight:700;letter-spacing:.08em;color:var(--blue);text-transform:uppercase}
.bcard h3{margin:14px 0 8px;font-size:1.2rem}.bcard .meta{padding:18px 26px 22px;color:var(--ink2);font-size:.82rem}
details{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;transition:border-color .15s}
details:hover,details[open]{border-color:#b7c3d6}
summary{cursor:pointer;padding:18px 22px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}summary:after{content:"+";color:var(--blue);font-size:1.3rem;line-height:1}
details[open] summary:after{content:"–"}
details p{padding:0 22px 20px;color:var(--ink2)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(11,22,38,.6);display:none;place-items:center;z-index:90;padding:20px}
.modal.on{display:grid}
.mbox{background:#fff;border-radius:18px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:32px;position:relative}
.mbox .x{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:1.2rem}
.mbox p{color:var(--ink2);margin-top:14px}
/* servicos */
.srow{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;padding-block:40px}
.srow.rev .art{order:2}
.art{position:relative;aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:#e9eef5;border:1px solid var(--line);box-shadow:var(--shadow)}
.art>img{width:100%;height:100%;object-fit:cover;filter:contrast(1.06) saturate(1.1)}
.art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(11,22,38,.28));pointer-events:none}
.art svg{width:100%;height:100%;display:block}
.art.tilebg{background:linear-gradient(180deg,#f8fafc 0,#eef2f7 56%,#d6dde8 56.3%,#e8ecf3 100%)}
.art.tilebg:after{background:radial-gradient(ellipse at 50% 28%,rgba(255,255,255,.9),transparent 62%)}
.art.tilebg>img{object-fit:contain;mix-blend-mode:multiply;width:78%;height:78%;margin:11%;position:relative;z-index:1}
.badge{position:absolute;left:16px;top:16px;z-index:2;width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.94);color:var(--blue);display:grid;place-items:center;box-shadow:var(--shadow)}
.flist{list-style:none;padding:0;margin:22px 0 28px;display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;color:var(--ink2);font-size:.93rem}
.flist li:before{content:"✓";color:var(--blue);font-weight:700;margin-right:9px}
.num{font:800 3.4rem Manrope;color:#dbe4f1;line-height:1;margin-bottom:6px;letter-spacing:-.04em}
.svc .art{aspect-ratio:16/10;margin-bottom:20px;box-shadow:none;border-radius:12px}
/* contacto */
.split{display:grid;grid-template-columns:1fr 1.25fr;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(14,26,43,.14);background:#fff}
.pane{background:linear-gradient(160deg,#3b69ad,#274f8d);color:#fff;padding:44px}
.pane h2,.fpane h2{font-size:1.7rem;margin-bottom:28px}.pane h2{color:#fff}
.irow{display:flex;gap:16px;margin-bottom:22px}
.ib{flex:none;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.irow b{display:block;font-weight:600}.irow p,.irow a{color:#dbe7f7;font-size:.92rem;margin:0}
.map{border-radius:14px;overflow:hidden;height:210px;margin-top:8px;position:relative;background:#cfdcf0}
.map iframe{width:100%;height:100%;border:0}
.map a{position:absolute;left:10px;bottom:10px;background:#fff;color:var(--blue-d);padding:6px 12px;border-radius:8px;font-size:.78rem;font-weight:600;box-shadow:var(--shadow)}
.fpane{padding:44px}.fpane .btn{width:100%}
/* pesquisa */
.sbar{display:flex;align-items:center;gap:12px;height:54px;padding:0 10px 0 16px;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--ink2);transition:border-color .15s;margin-bottom:12px}
.sbar:focus-within{border-color:#8794a9}
.sbar input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);caret-color:var(--blue);outline:none}
.sbar input::-webkit-search-cancel-button{display:none}
.sx{width:34px;height:34px;border-radius:50%;border:0;background:var(--bg);font-size:1.2rem;color:var(--ink2)}.sx:hover{background:var(--blue-l)}
.rc{font-size:.85rem;color:var(--ink2);margin:0 0 14px 4px}
/* blog */
.bcard{padding:0;overflow:hidden;display:flex;flex-direction:column;text-align:left}
.bimg{aspect-ratio:16/10;overflow:hidden;background:#e9eef5}.bimg img{width:100%;height:100%;object-fit:cover;transition:transform .4s}.bcard:hover .bimg img{transform:scale(1.05)}
.bcard .top{padding:22px 24px 0;flex:1}
.btag{background:#eef2f7;color:var(--ink2);font:600 .66rem Inter;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:6px}
.btag.dk{background:rgba(255,255,255,.12);color:#cfdbee}
.bcard .tags{display:flex;gap:6px;flex-wrap:wrap}
.bcard h3{margin:14px 0 8px;font-size:1.15rem;line-height:1.3}.bcard p{margin:0 0 6px}
.bcard .meta{display:flex;justify-content:space-between;padding:16px 24px 20px;color:var(--ink2);font-size:.8rem}.bcard .meta span{display:inline-flex;align-items:center;gap:6px}
.ph1{font-size:clamp(1.8rem,4vw,2.9rem);max-width:24ch}
.byline{display:flex;align-items:center;gap:10px;margin-top:22px;color:#b9c6da;font-size:.9rem;flex-wrap:wrap}.byline img{height:30px;width:auto;filter:brightness(1.9)}
.prose{max-width:760px;margin:0 auto}
.prose h2{font-size:1.5rem;margin:40px 0 14px}.prose p{color:#2b3a50;font-size:1.05rem;line-height:1.75;margin:0 0 16px}
.prose ul,.prose ol{margin:0 0 20px;padding-left:22px;display:grid;gap:10px;color:#2b3a50;font-size:1.02rem;line-height:1.65}.prose li::marker{color:var(--blue);font-weight:700}
.author{display:flex;gap:16px;align-items:center;margin-top:48px;padding:22px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.author img{height:54px;width:auto}.author b{display:block}.author span{color:var(--ink2);font-size:.88rem}
/* misc */
footer{background:var(--navy);color:#aebdd3;padding:64px 0 28px;font-size:.92rem}
footer .g{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:40px}
footer h4{color:#fff;font:700 .78rem Inter;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}
footer a{display:block;padding:4px 0}footer a:hover{color:#fff}
footer .bot{border-top:1px solid rgba(255,255,255,.1);margin-top:44px;padding-top:22px;font-size:.8rem}
.wa{position:fixed;right:22px;bottom:22px;z-index:60;width:58px;height:58px;border-radius:50%;background:#1faa59;color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.wa:hover{transform:scale(1.07)}
.cookie{position:fixed;left:22px;bottom:22px;z-index:70;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 16px 48px rgba(14,26,43,.2)}
.cookie p{font-size:.88rem;color:var(--ink2);margin:6px 0 16px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:95}
.toast.on{opacity:1;transform:translate(-50%,0)}
.note{font-size:.78rem;color:var(--ink2);margin-top:10px}
.todo{background:#fff6dc;border-radius:4px;padding:0 5px;font-size:.85em}
@media(max-width:960px){
 .g2,.cart,.shop,footer .g,.cols-c{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr}.g3.cols2{grid-template-columns:1fr 1fr}
 .side{position:static}.sum{position:static}.stats .wrap{grid-template-columns:1fr 1fr}.stat{border-bottom:1px solid var(--line)}
 .steps{grid-template-columns:1fr 1fr;gap:34px 0}.step:after{display:none}
 section{padding:56px 0}.hero .wrap{padding-top:96px;padding-bottom:96px}
 .srow,.split{grid-template-columns:1fr;gap:28px}.srow.rev .art{order:0}.pane,.fpane{padding:30px}
}
@media(max-width:1100px){

  if(k==='o'){if(!ol){close();h+='<ol>';ol=1}h+=`<li>${li(v)}</li>`}else if(k==='l'){if(!ul){close();h+='<ul>';ul=1}h+=`<li>${li(v)}</li>`}else{close();h+=k==='h'?`<h2>${v}</h2>`:`<p>${v}</p>`}});close();
 const rel=BLOG.filter(x=>x!==b).slice(0,3);
 return `<div class="phead"><div class="wrap"><div class="crumbs"><a href="#/">${t('home')}</a> / <a href="#/blog">${t('blog')}</a> / ${pick(b.n)}</div><div class="tags" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">${b.t.map(x=>`<span class="btag dk">${x}</span>`).join('')}</div><h1 class="ph1">${pick(b.n)}</h1><div class="byline"><img src="logo.png" alt=""><span>${t('by')}</span><span>·</span><span>${bdate(b.d)}</span><span>·</span><span>${b.m} ${t('min')}</span></div></div></div>
 <section style="padding-top:44px"><div class="wrap"><div class="prose"><div class="art" style="aspect-ratio:16/8;margin-bottom:40px"><img src="${b.img}" alt="${esc(pick(b.n))}"></div>${lang==='en'?`<p class="note" style="margin:-20px 0 24px">${t('ptOnly')}</p>`:''}${h}
 <div class="author"><img src="logo.png" alt=""><div><b>Baltazar Ferreira</b><span>Especialista em Serigrafia | Baltazar Ferreira</span></div></div></div></div></section>
 <section style="background:#fff;border-block:1px solid var(--line)"><div class="wrap"><h2 style="margin-bottom:28px">${t('rel')}</h2><div class="g3">${rel.map(bcard).join('')}</div></div></section>${ctaBand()}`}
const li=v=>{const i=v.indexOf(' — ');return i>0?`<b>${v.slice(0,i)}</b> — ${v.slice(i+3)}`:v};
function plist(f){return f.length?`${q?`<p class="rc">${f.length} ${lang==='pt'?'resultados':'results'}</p>`:''}<div class="pgrid">${f.map(p=>`<article class="card pcard"><button class="tile" data-open="${p.id}" aria-label="${t('details')}: ${esc(L(p.n))}"><img src="${p.img}" alt="" loading="lazy"></button><small>${L(CATS[p.cat])}</small><h3>${L(p.n)}</h3><p>${L(p.d)}</p><div class="row"><button class="btn btn-o btn-sm" data-add="${p.id}">${t('add')}</button><button class="btn btn-p btn-sm" data-ask="${p.id}">${t('ask')}</button></div></article>`).join('')}</div>`:`<div class="empty">${t('none')}</div>`}

/* ===== render e eventos ===== */
function render(){const r=({carrinho:'cart'})[rt()]||rt()||'home';const k=PAGES[r]?r:'home';const sg=location.hash.split('/'),bp=k==='blog'&&sg[2]&&BLOG.find(x=>x.slug===sg[2]);$('#app').innerHTML=bp?postPage(bp):PAGES[k]();document.title=bp?pick(bp.n)+' | Baltazar Ferreira':(t('pageT')[k==='serigrafia-em-portugal'?'pt':k]||t('pageT').home);chrome();$('#nav').classList.remove('on');$('#menub').setAttribute('aria-expanded','false');window.scrollTo(0,0)}
function modal(html){$('#mbox').innerHTML=`<button class="x" data-x aria-label="${t('close')}">×</button>${html}`;$('#modal').classList.add('on');$('#mbox .x').focus()}
function submit(form,kind){const d=Object.fromEntries(new FormData(form)),e=$('#err');
 if(!d.email||(kind==='c'&&!d.message))return e.textContent=t('eReq')||'';
 if(kind==='q'&&!d.name)return e.textContent=t('eReq');
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email))return e.textContent=t('eMail');
 if(!d.consent)return e.textContent=t('eCons');
 form.outerHTML=`<div class="ok" role="status">${t(kind==='q'?'okQ':'okC')}<br><small>${t('demo')}</small></div>`;
 if(kind==='q'){cart=[];st.set('carrinho',cart);chrome();$('.cart>.card').innerHTML=`<h3>${t('empty')}</h3><a class="more" href="#/products">${t('seeP')} →</a>`}}
document.addEventListener('click',e=>{const g=s=>e.target.closest(s);let b;
 if(b=g('[data-l]')){lang=b.dataset.l;st.set('lang',lang);render()}
 else if(b=g('[data-add]'))addCart(b.dataset.add);
 else if(b=g('[data-ask]')){addCart(b.dataset.ask);location.hash='#/carrinho'}
 else if(b=g('[data-open]')){const p=P.find(x=>x.id===b.dataset.open);modal(`${tile(p)}<div class="eyebrow" style="margin-top:22px">${L(CATS[p.cat])}</div><h2>${L(p.n)}</h2><p>${L(p.d)}</p><div class="row" style="margin-top:22px"><button class="btn btn-p" data-add="${p.id}">${t('add')}</button><a class="btn btn-o" href="#/carrinho" data-x>${t('ask')}</a></div>`)}
 else if(g('[data-qclear]')){q='';render()}
 else if(b=g('[data-c]')){cat=b.dataset.c;render()}
 else if(b=g('[data-cat]')){cat=b.dataset.cat;q=''}
 else if(b=g('[data-q]')){const c=cart.find(x=>x.id===b.dataset.q);c.q=Math.max(1,Math.min(999,c.q+ +b.dataset.d));st.set('carrinho',cart);render()}
 else if(b=g('[data-rm]')){cart=cart.filter(x=>x.id!==b.dataset.rm);st.set('carrinho',cart);render()}
 else if(b=g('[data-tag]')){tag=b.dataset.tag;render()}
 else if(b=g('[data-fc]')){fcat=+b.dataset.fc;render()}
 else if(b=g('[data-svc]')){sessionStorage.setItem('svc',b.dataset.svc)}
 else if(b=g('[data-ck]')){st.set('cookies',b.dataset.ck);ck() /* ligar o Google Analytics aqui só quando for 'yes' */}
 if(g('[data-x]')||e.target===$('#modal'))$('#modal').classList.remove('on')});
document.addEventListener('input',e=>{const i=e.target;if(i.id==='q'){q=i.value;$('#plist').innerHTML=plist(filt());document.querySelector('[data-qclear]').hidden=!q}
 const c=i.id&&document.querySelector(`.cnt[data-for="${i.id}"]`);if(c){c.textContent=i.value.length+'/'+i.maxLength;c.classList.toggle('warn',i.value.length>=i.maxLength*.9)}});
document.addEventListener('submit',e=>{e.preventDefault();submit(e.target,e.target.id==='qf'?'q':'c')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('on')});
$('#menub').onclick=()=>{const o=$('#nav').classList.toggle('on');$('#menub').setAttribute('aria-expanded',o)};
addEventListener('hashchange',()=>{render();const s=sessionStorage.getItem('svc');if(s&&rt()==='contact'){const m=$('#message');m&&(m.value=(lang==='pt'?'Gostaria de um orçamento para: ':'I would like a quote for: ')+pick(SV.find(x=>x.id===s).n)+'. ');sessionStorage.removeItem('svc')}});
render();
</script>
